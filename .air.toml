# Hot reload config for local development (https://github.com/air-verse/air)
# Run with: task dev   (or: air)
root = "."
tmp_dir = "tmp"

[build]
  # On Windows, `task dev` overrides cmd/bin to add the .exe extension.
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  include_ext = ["go", "json", "env"]
  include_file = [".env"]
  exclude_dir = [".cookies", ".git", ".github", ".kilo", ".venv", "assets", "docs", "examples", "tests", "tmp", "vendor"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true
  log = "build-errors.log"

[log]
  time = true
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
